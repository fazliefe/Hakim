# HÂKİM model routing. Secrets stay in .env (HAKIM_LLM_API_KEY).
# Switch stack with `active` below, or env: HAKIM_PROFILE=groq|ollama|colab|evren
# Optional path override: HAKIM_MODELS_CONFIG=/path/to/models.yaml

active: evren

defaults:
  embedding:
    model: newmindai/Mursit-Base-TR-Retrieval
    dims: 768
  research:
    allow_ollama: false
  llm:
    max_tokens: 900
    timeout: 25
    temperature: 0.2
    # Groq openai/gpt-oss-20b (USD / 1M tokens)
    input_per_million: 0.075
    output_per_million: 0.30

profiles:
  groq:
    writer: api
    llm:
      url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-20b
    ollama:
      enabled: false
      url: http://127.0.0.1:11434
      model: llama3.2:3b
      keep_alive: 30m

  ollama:
    writer: ollama
    llm:
      url: http://127.0.0.1:11434
      model: llama3.2:3b
      timeout: 120
    ollama:
      enabled: true
      url: http://127.0.0.1:11434
      model: llama3.2:3b
      keep_alive: 30m
    research:
      allow_ollama: true

  colab:
    writer: ollama
    llm:
      url: http://127.0.0.1:11434
      model: qwen4b-spq
      timeout: 120
    ollama:
      enabled: true
      url: http://127.0.0.1:11434
      model: qwen4b-spq
      keep_alive: 30m
    embedding:
      model: newmindai/Mursit-Base-TR-Retrieval
      dims: 768
    research:
      allow_ollama: true

  # TEKNOFEST 2026 çıkarım servisi: 8xH200, OpenAI-uyumlu, kota yok.
  # Anahtar takım başına: HAKIM_LLM_API_KEY=sk-evren-team06-... (.env, gerçek key)
  # vlm (video) ve bge-m3-embed ayrı uçlar üzerinden çalışır, bu writer profili
  # llm-fast/llm-large metin çağrılarını kapsar. Detay: https://evren-teknofest.ssyz.org.tr/
  evren:
    writer: api
    llm:
      url: https://evren-llmapi.ssyz.org.tr/v1
      model: llm-fast
      timeout: 120
      max_tokens: 3072
      # Kotasız/ücretsiz TEKNOFEST H200 servisi; defaults.llm'deki groq USD
      # tarifesi burada geçerli değil — usage.py yanlış maliyet raporlamasın.
      input_per_million: 0.0
      output_per_million: 0.0
      # Qwen thinking modu varsayılan açık: karmaşık promptlarda reasoning izi
      # max_tokens'ı tüketip boş içerik döndürüyordu (canlı doğrulandı — aynı
      # istek thinking açıkken 2320, kapalıyken 126 token). vLLM/Qwen3 standart
      # parametresiyle kapatılıyor.
      disable_reasoning: true
    ollama:
      enabled: false
      url: http://127.0.0.1:11434
      model: llama3.2:3b
      keep_alive: 30m
