[project]
name = "hakim-legal-schema"
version = "0.1.0"
description = "HAKİM Legal Data Model v1 — canonical legal entities, IDs, and temporal versions"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
