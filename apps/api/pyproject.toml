[project]
name = "hakim-api"
version = "0.1.0"
description = "HAKİM FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn[standard]>=0.32",
    "hakim-legal-schema",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "elasticsearch>=8.15,<9",
    "neo4j>=5.26",
    "sentence-transformers>=3.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0",
    "langgraph>=0.2",
    "langfuse>=3.0",
    "typing-extensions>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
hakim-legal-schema = { workspace = true }
