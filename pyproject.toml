[project]
name = "hakim"
version = "0.1.0"
description = "HAKİM — source-first legal research workspace"
requires-python = ">=3.12"
dependencies = [
    "hakim-legal-schema",
    "hakim-api",
]

[tool.uv.workspace]
members = ["packages/legal-schema", "apps/api"]

[tool.uv.sources]
hakim-legal-schema = { workspace = true }
hakim-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "elasticsearch>=8.15,<9",
    "sentence-transformers>=3.0",
    "neo4j>=5.26",
    "pypdf>=5.0",
    "pytesseract>=0.3.13",
    "pymupdf>=1.28.2",
    "huggingface_hub>=0.25",
    "pyarrow>=17.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = [
    "packages/legal-schema/tests",
    "apps/api/tests",
    "connectors/mevzuat/tests",
    "connectors/courts/tests",
    "connectors/agencies/tests",
    "services/ingestion/tests",
    "services/retrieval/tests",
    "services/graph/tests",
    "services/deadline/tests",
    "services/document_ai/tests",
    "services/llm/tests",
]
pythonpath = [
    "packages/legal-schema/src",
    "apps/api/src",
    "connectors",
    "services",
]
