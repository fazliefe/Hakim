name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        # Testler için Postgres/Elasticsearch/Neo4j gerekmiyor: canlı bağlantı
        # bekleyen testler o servis yoksa kendiliğinden skip ediyor
        # (bkz. services/ingestion/tests/test_postgres_writer.py).
        run: uv run pytest -q

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit/component tests
        run: npm test

      - name: Build (type-check + compile)
        run: npm run build
